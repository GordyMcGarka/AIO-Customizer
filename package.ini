[@Main Page]

[AIO Customizer]

[Header]
;creator=GordyMcGarka
;about='This package allows easy customization of Ultrahand color settings, boot customization, and Hekate customization.'
;version='1.3.1+r3'
;assets_version='1.0.3'
;color=#800080
;show_widget=true
;mode=table
;polling=true
;background=false
;spacing=5
ini_file ./ini/updater&cleanup/config.ini
'Date & Time'='{timestamp(%Y-%m-%d | %H:%M:%S)}'
'Wifi Status'='{if_!=({local_ip},Not available,{if_null({ini_file(Release Info,latest_version)},{WARNING_SYMBOL} Wi-Fi connected - no internet!,Wi-Fi connected!)},{WARNING_SYMBOL} No Wi-Fi connection!)}'


[Gap]
;mode=table
;background=false
;gap=15

[Header]
;mode=table
;header_indent=true
;background=false
'Customization' =''


[*Boot Customization]
;mode=forwarder
package_source './ini/boot customization/boot_customization.ini'
exec 'Boot Customization' './ini/boot customization/boot_package.ini'

[*Hekate Customization]
;mode=forwarder
package_source './ini/hekate customization/hekate_customization.ini'
exec 'Hekate Customization' './ini/hekate customization/boot_package.ini'
exec 'Backlight level' './ini/hekate customization/boot_package.ini'

[*Theme Customization]
;mode=forwarder
package_source './ini/theme customization/theme_customizer.ini'
exec 'Wallpaper' './ini/theme customization/boot_package.ini'
exec 'Cleanup' './ini/theme customization/boot_package.ini'


[Gap]
;mode=table
;background=false
;gap=15

[Header]
;mode=table
;header_indent=true
;background=false
'Updater/Cleanup' =''


[*Updater/Cleanup]
;mode=forwarder
package_source './ini/updater&cleanup/updater_cleanup.ini'
exec 'Version Match' './ini/updater&cleanup/boot_package.ini'
exec 'Firmware Release Info' './ini/updater&cleanup/boot_package.ini'



[Package Info]



[@Options]

[AIO Customizer]

[Date & Time]
;mode=table
;polling=true
;background=false
;spacing=5
ini_file ./ini/updater&cleanup/config.ini
'Date & Time'='{timestamp(%Y-%m-%d | %H:%M:%S)}'
'Wifi Status'='{if_!=({local_ip},Not available,{if_null({ini_file(Release Info,latest_version)},{WARNING_SYMBOL} Wi-Fi connected - no internet!,Wi-Fi connected!)},{WARNING_SYMBOL} No Wi-Fi connection!)}'


[Gap]
;mode=table
;background=false
;gap=15

[Header]
;mode=table
;header_indent=true
;background=false
'More Options' =''


[*Music]
;mini=true
;mode=forwarder
package_source ./ini/music/music.ini
exec 'Music' './ini/music/boot_package.ini'
exec 'Release Info' './ini/music/boot_package.ini'

[*Exosphere]
;mini=true
;mode=forwarder
package_source './ini/exosphere/exosphere.ini'



[*More]
;mini=true

[Package Info ]
;mini=true
;mode=toggle?on
on:
remove-ini-key ./package.ini 'Package Info' ;mode
remove-ini-key ./package.ini 'Package Info' ;background
refresh-to 'Package Info '
off:
set-ini-val ./package.ini 'Package Info' ;mode table
set-ini-val ./package.ini 'Package Info' ;background false
refresh-to 'Package Info '

[Show Widget]
;mini=true
;mode=toggle?on
on:
set-ini-val ./package.ini Header ;show_widget true
refresh-to 'Show Widget'
off:
set-ini-val ./package.ini Header ;show_widget false
refresh-to 'Show Widget'

[Auto-Download Updates]
;mini=true
;mode=toggle?off
on:
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' 'Auto Update' auto_update on
off:
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' 'Auto Update' auto_update off


[Gap]
;mode=table
;background=false
;gap=15

[Header]
;mode=table
;background=false
;header_indent=true
'Host Guard'=''


[emuMMC Blocking]
;mini=true
;mode=toggle?on
on:
copy ./txt/emummc.txt /atmosphere/hosts/
off:
delete /atmosphere/hosts/emummc.txt

[sysMMC Blocking]
;mini=true
;mode=toggle?off
on:
copy ./txt/sysmmc.txt /atmosphere/hosts/
off:
delete /atmosphere/hosts/sysmmc.txt


[Gap]
;mode=table
;background=false
;gap=15

[Header]
;mode=table
;background=false
;header_indent=true
'Notifications'=''

[Updates Notification]
;mini=true
;mode=toggle?on
on:
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' Notification updates_notification on
off:
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' Notification updates_notification off

[Wifi Off Notification]
;mini=true
;mode=toggle?on
on:
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' Notification wifi_off_notification on
off:
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' Notification wifi_off_notification off

[No Internet Access Notification]
;mini=true
;mode=toggle?on
on:
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' Notification no_internet_access_notification on
off:
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' Notification no_internet_access_notification off



[Gap]
;mode=table
;background=false
;gap=10

[Header]
;mode=table
;polling=false
;background=false
;gap=15
ini_file ./config.ini
'Current: {ovl_version(/switch/.overlays/QuickNTP.ovl)}'='Latest: {ini_file(Release Info,QuickNTP)}'

[Gap]
;mode=table
;background=false
;gap=5


[Download QuickNTP]
;mini=true
try:
ini_file ./config.ini
set-ini-val ./config.ini Timer start {timestamp(%s.%f)}
notify-now 'Updating to {ini_file(Release Info,QuickNTP)} press {R} to stop' 20 left word 2250 QuickNTP true
download https://api.github.com/repos/ppkantorski/QuickNTP/releases?per_page=1 /config/ultrahand/downloads/quick_ntp.json
json_file /config/ultrahand/downloads/quick_ntp.json
download {json_file(0,assets,0,browser_download_url)} /switch/.overlays/
set-ini-val ./config.ini Timer stop {timestamp(%s.%f)}
notify-now 'Updated to {ini_file(Release Info,QuickNTP)} took {math({ini_file(Timer,stop)}-{ini_file(Timer,start)})}s' 20 left word 2250 QuickNTP true
delete /config/ultrahand/downloads/*

[Open QuickNTP]
;mini=true
try:
path_exists /switch/.overlays/QuickNTP.ovl
open /switch/.overlays/QuickNTP.ovl

try:
!path_exists /switch/.overlays/QuickNTP.ovl
notify-now 'Module not installed' 20 left word 2250 QuickNTP true 



