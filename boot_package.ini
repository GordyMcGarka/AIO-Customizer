[boot]
try:
download https://raw.githubusercontent.com/GordyMcGarka/AIO-Customizer/main/RELEASE.ini /config/ultrahand/downloads/
ini_file /config/ultrahand/downloads/RELEASE.ini
set-ini-val '/switch/.packages/AIO Customizer/config.ini' 'Release Info' QuickNTP '{ini_file(Release Info,QuickNTP)}'
delete /config/ultrahand/downloads/*

exec 'Backup' '/switch/.packages/AIO Customizer/ini/updater&cleanup/boot_package.ini'

ini_file /config/ultrahand/theme.ini

set-ini-val './ini/theme customization/colors options/config.ini' theme table_bg_color {ini_file(theme,table_bg_color)}

set-ini-val './ini/theme customization/colors options/config.ini' theme table_bg_alpha {ini_file(theme,table_bg_alpha)}

exec 'Version Match' '/switch/.packages/AIO Customizer/ini/updater&cleanup/boot_package.ini'