[Overlays Release Info]
try:
download https://raw.githubusercontent.com/GordyMcGarka/AIO-Customizer/main/RELEASE.ini /config/ultrahand/downloads/
ini_file /config/ultrahand/downloads/RELEASE.ini

set-ini-val '/switch/.packages/AIO Customizer/ini/overlays/config.ini' 'Overlays Release Info' 'Horizon-OC' '{ini_file(Overlays Release Info,Sys-clk)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/overlays/config.ini' 'Overlays Release Info' QuickNTP '{ini_file(Overlays Release Info,QuickNTP)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/overlays/config.ini' 'Overlays Release Info' Tetris '{ini_file(Overlays Release Info,Tetris)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/overlays/config.ini' 'Overlays Release Info' OvlSysmodules '{ini_file(Overlays Release Info,OvlSysmodules)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/overlays/config.ini' 'Overlays Release Info' 'Status-Monitor' '{ini_file(Overlays Release Info,Status-Monitor)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/overlays/config.ini' 'Overlays Release Info' FPSLocker '{ini_file(Overlays Release Info,FPSLocker)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/overlays/config.ini' 'Overlays Release Info' ReverseNX-RT '{ini_file(Overlays Release Info,ReverseNX-RT)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/overlays/config.ini' 'Overlays Release Info' Fizeau '{ini_file(Overlays Release Info,Fizeau)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/overlays/config.ini' 'Overlays Release Info' 'Sys-dvr' '{ini_file(Overlays Release Info,Sys-dvr)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/overlays/config.ini' 'Overlays Release Info' NX-FanControl '{ini_file(Overlays Release Info,NX-FanControl)}'

delete /config/ultrahand/downloads/*
refresh