[Backup]
try:
!path_exists '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini'
move '/switch/.packages/AIO Customizer/ini/updater&cleanup/config_preset.ini' '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini'
!path_exists '/switch/.packages/AIO Customizer/ini/boot customization/config.ini'
move '/switch/.packages/AIO Customizer/ini/boot customization/config_preset.ini' '/switch/.packages/AIO Customizer/ini/boot customization/config.ini'
!path_exists '/switch/.packages/AIO Customizer/ini/theme customization/colors options/config.ini'
move '/switch/.packages/AIO Customizer/ini/theme customization/colors options/config_preset.ini' '/switch/.packages/AIO Customizer/ini/theme customization/colors options/config.ini'

try:
path_exists '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini'
del '/switch/.packages/AIO Customizer/ini/updater&cleanup/config_preset.ini'
path_exists '/switch/.packages/AIO Customizer/ini/boot customization/config.ini'
del '/switch/.packages/AIO Customizer/ini/boot customization/config_preset.ini'
path_exists '/switch/.packages/AIO Customizer/ini/theme customization/colors options/config.ini'
del '/switch/.packages/AIO Customizer/ini/theme customization/colors options/config_preset.ini'


[Current Release]
ini_file '/switch/.packages/AIO Customizer/package.ini'
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' 'Release Info' current_version {ini_file(Header,;version)}


[Release Info]
download 'https://raw.githubusercontent.com/GordyMcGarka/AIO-Customizer/main/package.ini' '/switch/.packages/AIO Customizer/ini/updater&cleanup/version.ini'
ini_file '/switch/.packages/AIO Customizer/ini/updater&cleanup/version.ini'
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' 'Release Info' latest_version '{ini_file(Header,;version)}'
set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' 'Assets Info' latest_version '{ini_file(Header,;assets_version)}'
delete '/switch/.packages/AIO Customizer/ini/updater&cleanup/version.ini'


[Version Match]
ini_file '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini'

exec 'Current Release' '/switch/.packages/AIO Customizer/ini/updater&cleanup/boot_package.ini'

exec 'Release Info' '/switch/.packages/AIO Customizer/ini/updater&cleanup/boot_package.ini'

'{if_version_>({ini_file(Release Info,latest_version)},{ini_file(Release Info,current_version)},{if_!null({ini_file(Release Info,latest_version)},{if_==({ini_file(Notification,updates_notification)},on,notify-now,pass)},pass)},pass)}' '{WARNING_SYMBOL} New update is available!' 20 center word 2000 '{ini_file(Release Info,latest_version)}' true
 
'{if_!=({local_ip},Not available,{if_null({ini_file(Release Info,latest_version)},{if_==({ini_file(Notification,no_internet_access_notification)},on,notify-now,pass)},pass)},pass)}' '{WARNING_SYMBOL} Wi-Fi connected - no internet!' 20 center word 2000 'Wifi status' true

'{if_==({local_ip},Not available,{if_==({ini_file(Notification,wifi_off_notification)},on,notify-now,pass)},pass)}' '{WARNING_SYMBOL} No Wi-Fi connection!' 20 center word 2000 'Wifi status' true

'{if_==({ini_file(Auto Update,auto_update)},on,{if_version_>({ini_file(Release Info,latest_version)},{ini_file(Release Info,current_version)},{if_!null({ini_file(Release Info,latest_version)},exec,pass)},pass)},pass)}'  Update '/switch/.packages/AIO Customizer/ini/updater&cleanup/boot_package.ini'



[Update]
ini_file '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini'
download https://api.github.com/repos/GordyMcGarka/Ultrahand-Customizer/releases?per_page=1 /config/ultrahand/downloads/aio-customizer-api.json
json_file /config/ultrahand/downloads/aio-customizer-api.json
notify-now 'Updating to {ini_file(Release Info,latest_version)} press {R} to stop' 20 left word 2250 'AIO Customizer' true
download {json_file(0,assets,0,browser_download_url)} /config/ultrahand/downloads/aio-customizer.zip
unzip /config/ultrahand/downloads/aio-customizer.zip /switch/.packages/
exec Backup '/switch/.packages/AIO Customizer/ini/updater&cleanup/boot_package.ini'
exec 'Current Release' '/switch/.packages/AIO Customizer/boot_package.ini'
exec 'Release Info' '/switch/.packages/AIO Customizer/boot_package.ini'
delete /config/ultrahand/downloads/*
notify-now 'Auto-updated to {ini_file(Release Info,latest_version)}' 20 left word 2250 'AIO Customizer' true



[Firmware Release Info]
try:
download https://raw.githubusercontent.com/GordyMcGarka/AIO-Customizer/main/RELEASE.ini /config/ultrahand/downloads/
ini_file /config/ultrahand/downloads/RELEASE.ini

set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' 'Firmware Release Info' Atmosphere '{ini_file(Release Info,Atmosphere)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' 'Firmware Release Info' Hekate '{ini_file(Release Info,Hekate)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' 'Firmware Release Info' Sys-patch '{ini_file(Release Info,Sys-patch)}'

set-ini-val '/switch/.packages/AIO Customizer/ini/updater&cleanup/config.ini' 'Firmware Release Info' Firmware '{ini_file(Release Info,Firmware)}'

delete /config/ultrahand/downloads/*
refresh