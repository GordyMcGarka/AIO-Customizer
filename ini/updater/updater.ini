[@Assets]

[Header]
;mode=table
;header_indent=true
;background=false
;spacing=5
ini_file ./config.ini
'Update Assets' =''
'{if_!null({ini_file(Assets Info,current_version)},Current: {ini_file(Assets Info,current_version)},{INFO_SYMBOL} Assets are missing!)}'='Latest: {ini_file(Assets Info,latest_version)}'

[Update Assets]
try:
ini_file ./config.ini
set-ini-val ./config.ini Timer start {timestamp(%s.%f)}
'{if_==({ini_file(Disable ALL Assets,status)},on,notify-now,pass)}' 'Disabling ALL Assets' 20 left word 2250 Assets true
'{if_==({ini_file(Disable ALL Assets,status)},on,exec,pass)}' 'Disable Bootlogo' '/switch/.packages/AIO Customizer/ini/boot customization/boot_package.ini'
'{if_==({ini_file(Disable ALL Assets,status)},on,exec,pass)}' 'Disable Bootsound' '/switch/.packages/AIO Customizer/ini/boot customization/boot_package.ini'
'{if_==({ini_file(Disable ALL Assets,status)},on,exec,pass)}' 'Disable Background' '/switch/.packages/AIO Customizer/ini/hekate customization/boot_package.ini'
'{if_==({ini_file(Disable ALL Assets,status)},on,exec,pass)}' 'Disable App Store Music' '/switch/.packages/AIO Customizer/ini/music/boot_package.ini'
'{if_==({ini_file(Disable ALL Assets,status)},on,exec,pass)}' 'Disable Sphaira Music' '/switch/.packages/AIO Customizer/ini/music/boot_package.ini'
'{if_==({ini_file(Disable ALL Assets,status)},on,exec,pass)}' 'Disable Home Menu Music' '/switch/.packages/AIO Customizer/ini/music/boot_package.ini'
'{if_==({ini_file(Disable ALL Assets,status)},on,exec,pass)}' 'Disable Wallpaper' '/switch/.packages/AIO Customizer/ini/theme customization/boot_package.ini'
'{if_==({ini_file(Delete ALL Assets,status)},on,notify-now,pass)}' 'Deleting ALL Assets' 20 left word 2250 Assets true
'{if_==({ini_file(Delete ALL Assets,status)},on,del,pass)}' '/switch/.packages/AIO Customizer/background/'
'{if_==({ini_file(Delete ALL Assets,status)},on,del,pass)}' '/switch/.packages/AIO Customizer/bootlogo/'
'{if_==({ini_file(Delete ALL Assets,status)},on,del,pass)}' '/switch/.packages/AIO Customizer/bootsound/'
'{if_==({ini_file(Delete ALL Assets,status)},on,del,pass)}' '/switch/.packages/AIO Customizer/music/'
'{if_==({ini_file(Delete ALL Assets,status)},on,del,pass)}' '/switch/.packages/AIO Customizer/splashscreen/'
'{if_==({ini_file(Delete ALL Assets,status)},on,del,pass)}' '/switch/.packages/AIO Customizer/wallpaper/'
'{if_==({ini_file(Delete ALL Assets,status)},on,del,pass)}' '/switch/.packages/AIO Customizer/icon/'

notify-now 'Updating ALL Assets press {R} to stop' 20 left word 2250 Assets true
download https://github.com/GordyMcGarka/AIO-Customizer/releases/latest/download/assets.zip /config/ultrahand/downloads/
notify-now 'Extracting' 20 left word 2250 Assets true
unzip /config/ultrahand/downloads/assets.zip /
ini_file ./RELEASE.ini
set-ini-val ./config.ini 'Assets Info' current_version '{ini_file(Assets Info,current_version)}'
delete ./RELEASE.ini
ini_file ./config.ini
exec 'Boot Customization' '/switch/.packages/AIO Customizer/ini/boot customization/boot_package.ini'
exec 'Hekate Customization' '/switch/.packages/AIO Customizer/ini/hekate customization/boot_package.ini'
exec 'Wallpaper' '/switch/.packages/AIO Customizer/ini/theme customization/boot_package.ini'
exec 'Music' '/switch/.packages/AIO Customizer/ini/music/boot_package.ini'
delete /config/ultrahand/downloads/*
set-ini-val ./config.ini Timer stop {timestamp(%s.%f)}
notify-now 'Updated to {ini_file(Assets Info,current_version)}, took {math({ini_file(Timer,stop)}-{ini_file(Timer,start)})}s' 20 left word 2250 Assets true
refresh-to 'Update Assets'



[Gap]
;mode=table
;background=false
;gap=10

[Info]
;mode=table
;background=false
'When updating all assets{DOWN_ARROW}:'=''

[Gap]
;mode=table
;background=false
;gap=5

[Disable Assets]
;mini=true
;mode=toggle?off
on:
    set-ini-val ./config.ini 'Disable ALL Assets' status on
off:
    set-ini-val ./config.ini 'Disable ALL Assets' status off


[Delete Assets]
;mini=true
;mode=toggle?off
on:
    set-ini-val ./config.ini 'Delete ALL Assets' status on
off:
    set-ini-val ./config.ini 'Delete ALL Assets' status off



[Gap]
;mode=table
;background=false
;gap=15

[Header]
;mode=table
;header_indent=true
;background=false
'Delete/Download Assets' =''

[*Boot Customization]
;mode=forwarder
;mini=true
package_source './boot.ini'



[*Musics Customization]
;mode=forwarder
;mini=true
package_source './music.ini'



[*Hekate & Wallpapers]
;mode=forwarder
;mini=true
package_source './h_w.ini'