[@Updater]

[Header]
;mode=table
;header_indent=true
;background=false
;spacing=5
ini_file ./config.ini
'Updater' =''
'Current: {ini_file(Release Info,current_version)}'='Latest: {ini_file(Release Info,latest_version)}'


[AIO Customizer - Latest]
try:
ini_file ./config.ini
set-ini-val ./config.ini Timer start {timestamp(%s.%f)}
download https://api.github.com/repos/GordyMcGarka/Ultrahand-Customizer/releases/latest /config/ultrahand/downloads/aio-customizer-api.json
json_file /config/ultrahand/downloads/aio-customizer-api.json
notify-now 'Updating to {ini_file(Release Info,latest_version)} press {R} to stop' 20 left word 2250 'AIO Customizer' true
download {json_file(assets,0,browser_download_url)} /config/ultrahand/downloads/aio-customizer.zip
notify-now 'Extracting' 20 left word 2250 'AIO Customizer' true
unzip /config/ultrahand/downloads/aio-customizer.zip /switch/.packages/
exec Backup
exec 'Current Release'
exec 'Release Info'
set-ini-val ./config.ini Timer stop {timestamp(%s.%f)}
notify-now 'Updated to {ini_file(Release Info,latest_version)} took {math({ini_file(Timer,stop)}-{ini_file(Timer,start)})}s' 20 left word 2250 'AIO Customizer' true 
delete /config/ultrahand/downloads/*
refresh-to 'AIO Customizer'



[Gap]
;mode=table
;background=false
;gap=15

[Header]
;mode=table
;header_indent=true
;background=false
'Firmware' =''


[Update ALL - Latest]
try:
exec 'Atmosphere - Latest' ./updater.ini
exec 'Firmware - Latest' ./updater.ini
exec 'Hekate - Latest' ./updater.ini
exec 'Sys-Patch - Latest' ./updater.ini


[Gap]
;mode=table
;background=false
;gap=10

[Atmosphere Version]
;mode=table
;polling=false
;background=false
ini_file ./config.ini
'Current: {ams_version}'='Latest: {ini_file(Firmware Release Info,Atmosphere)}'

[Gap]
;mode=table
;background=false
;gap=5

[Atmosphere - Latest]
;mini=true
