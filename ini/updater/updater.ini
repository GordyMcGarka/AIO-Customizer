json_file /config/ultrahand/downloads/atmosphere-api.json
notify-now 'Updating to {json_file(tag_name)} press {R} to stop' 20 left word 2250 Atmosphere true
download {json_file(assets,0,browser_download_url)} /config/ultrahand/downloads/atmosphere.zip
download {json_file(assets,1,browser_download_url)} '/firmware update/bootloader/payloads/'
notify-now 'Extracting' 20 left word 2250 Atmosphere true
unzip /config/ultrahand/downloads/atmosphere.zip /
set-ini-val ./config.ini Timer stop {timestamp(%s.%f)}
notify-now 'Updated to {json_file(tag_name)} took {math({ini_file(Timer,stop)}-{ini_file(Timer,start)})}s' 20 left word 2250 Atmosphere true
delete /config/ultrahand/downloads/*
refresh-to 'Atmosphere'



