[@Main]

[Highlights & Logos]

[*Highlight]

[Presets Colors]
;mode=named_step_trackbar
;unlocked=true
;on_every_tick=true
ini_file ./config.ini
json_file_source '/switch/.packages/AIO Customizer/json/sort_by.json' name
set-ini-val ./config.ini theme color {json_file_source(*,hex)}
set-ini-val /config/ultrahand/theme.ini theme table_bg_color {ini_file(theme,color)}
refresh theme


[Gap]
;mode=table
;background=false
;gap=15

[Color Sample]
;mode=table
;background=true
;border=false

[Gap]
;mode=table
;background=false
;gap=15


[highlight color 1]
;mini=true
;footer=■
;footer_color=
ini_file ./config.ini
set-ini-val /config/ultrahand/theme.ini theme highlight_color_1 {ini_file(theme,color)}
set-ini-val ./highlights&logos.ini 'highlight color 1' ;footer_color {ini_file(theme,color)}
refresh theme
refresh-to 'highlight color 1'

