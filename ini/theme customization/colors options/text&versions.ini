[@Main]

[Text & Versions]

[*General]

[Presets Colors]
;mode=named_step_trackbar
;unlocked=true
;on_every_tick=true
ini_file ./config.ini
json_file_source '/switch/.packages/AIO Customizer/json/sort_by.json' name
set-ini-val ./config.ini theme color {json_file_source(*,hex)}
set-ini-val /config/ultrahand/theme.ini theme table_bg_color {ini_file(theme,color)}
refresh theme


[Gap]
;mode=table
;background=false
;gap=15

[Color Sample]
;mode=table
;background=true
;border=false

[Gap]
;mode=table
;background=false
;gap=15


[banner version text color]
;mini=true
;footer=■
;footer_color=
ini_file ./config.ini
set-ini-val /config/ultrahand/theme.ini theme banner_version_text_color {ini_file(theme,color)}
set-ini-val ./text&versions.ini 'banner version text color' ;footer_color {ini_file(theme,color)}
refresh theme
refresh-to 'banner version text color'

