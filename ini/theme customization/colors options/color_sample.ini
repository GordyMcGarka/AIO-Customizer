[Colors]

[Black]
;mini=true
;footer=■
;footer_color=000000
ini_file ./config.ini
set-ini-val ./config.ini '{ini_file(Smart Theme,color)}' color 000000
set-ini-val ./smart_theme.ini '{ini_file(Smart Theme,color)}' ;footer_color 000000
exec '{ini_file(Smart Theme,exec)}'
refresh theme
refresh-return
back


