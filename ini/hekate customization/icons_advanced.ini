[@Icons Advanced]

[*Stock ]
;mode=option
;mini=true
file_source '/switch/.packages/AIO Customizer/icon/*.bmp'
ini_file ./config.ini
'{if_==({ini_file(*Stock,command)},set-ini-val,set-ini-val,pass)}' /bootloader/hekate_ipl.ini '{ini_file(*Stock,footer)}' icon '/switch/.packages/AIO Customizer/icon/{file_name}.bmp'
'{if_!=({ini_file(*Stock,command)},set-ini-val,notify-now,pass)}' notify-now 'Setup icon first' 20 left word 2250 Stock true
'{if_==({ini_file(*Stock,command)},set-ini-val,set-footer,pass)}' {file_name}
refresh-return
back

