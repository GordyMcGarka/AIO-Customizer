[Reset configs ]

[Reset configs ]
ini_file ./config.ini
remove-ini-key /bootloader/hekate_ipl.ini '{ini_file(*Stock,footer)}' icon
remove-ini-key /bootloader/hekate_ipl.ini '{ini_file(*EmuMMC,footer)}' icon
remove-ini-key /bootloader/hekate_ipl.ini '{ini_file(*SysMMC,footer)}' icon
remove-ini-key /bootloader/hekate_ipl.ini '{ini_file(*Android,footer)}' icon
remove-ini-key /bootloader/hekate_ipl.ini '{ini_file(*Ubuntu,footer)}' icon
remove-ini-key /bootloader/hekate_ipl.ini '{ini_file(*Linux,footer)}' icon
remove-ini-key /bootloader/hekate_ipl.ini '{ini_file(*Lakka,footer)}' icon
remove-ini-key /bootloader/hekate_ipl.ini '{ini_file(*Lockpick RCM,footer)}' icon
remove-ini-key ./config.ini '*Stock ' footer
remove-ini-key ./config.ini '*EmuMMC ' footer
remove-ini-key ./config.ini '*SysMMC ' footer
remove-ini-key ./config.ini '*Android ' footer
remove-ini-key ./config.ini '*Ubuntu ' footer
remove-ini-key ./config.ini '*Linux ' footer
remove-ini-key ./config.ini '*Lakka ' footer
remove-ini-key ./config.ini '*Lockpick RCM ' footer
refresh-to '*Stock '
